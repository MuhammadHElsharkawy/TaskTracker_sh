<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="shortcut icon" href="./images/task-management-8.svg" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <section class="app">
        <div class="container">
            <h1>Task Tracker</h1>
            <form id="task-form">
                <label for="task-input" class="input-container">
                    <input id="task-input" type="text" placeholder="Start writing and press enter to create task">
                    <button id="add-task-btn" type="submit" aria-label="Submit task">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-corner-down-left-icon lucide-corner-down-left">
                            <path d="M20 4v7a4 4 0 0 1-4 4H4" />
                            <path d="m9 10-5 5 5 5" />
                        </svg>
                    </button>
                </label>
                <p id="error-message" class="error-message hidden"></p>
            </form>
            <div id="tasks-container" class="tasks-container"></div>
        </div>
    </section>
    <script src="./js/main.js"></script>
</body>

</html>
